l_english:
 ### COPY ALI_:0 "" 
 ### OBSOLETE? ###
 ALI_the_kings_choice:0 "The Northern Allies"
 ALI_the_kings_choice_desc:0 "One of the early theaters in the war was the war in Norway. Fought to gain control of the Swedish ore, this became the proving ground of paratroopers and marines.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 ### Norway ###
 ALI_spirit_of_oscarsborg:0 "Hæren"
 ALI_spirit_of_oscarsborg_desc:0 "This Is Our Promise - The Norwegian Army will defend their territory tooth and nail. Whether it be by clipping wings on planes, by rushing through the mountain passes, all bolstered by a government backing their every decision all the way through.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!"
 ALI_avonforce:0 "The King's Finest"
 ALI_avonforce_tt:0 "Adds §O2 25-width Mountaineer Divisions§! with artillery, recon and engineer support.\n"
 ALI_avonforce_desc:0 "The original force designated for the rescue of Narvik during Weserübung, the German invasion of Norway.\n\n These §YMountaineer Divisions§! are §YKey Pieces§! that excel at battle in rough terrain."
 ALI_elverum_declaration:0 "Elverum Declaration"
 ALI_elverum_declaration_desc:0 "The Elverum Declaration was issued immediately after the invasion by the Norwegian Parliament to provide the government with expanded powers through the war.\n\n Gain §YPolitical Power§!."
 ALI_milorg:0 "Milorg"
 ALI_milorg_desc:0 "The Milorg was the main resistance network in Norway during the Second World War. Working in all areas of resistance, it was able to mobilize 1 in 50 Norwegians for an armed liberation\n\nGain §YSpecial Forces§! and §YIntelligence Agency§! bonuses."
 ALI_military_police_forces:0 "Delaying Forces"
 ALI_military_police_forces_desc:0 "15,000 men were trained in Sweden during the War as part of the preparation for the liberation of Norway as police and normal infantry. These would play a role in the post-war.\n\nThese §YInfantry Divisions§! are §YKey Pieces§! to bolster your frontline."
 ALI_through_the_mountains:0 "Through the Mountains"
 ALI_through_the_mountains_desc:0 "The mountains and fells of Norway are excellent places to place artillery. This was exploited by the Norwegian Army and later by the German occupation.\n\nGain §YArtillery§! bonuses."
 ALI_fortitude_north:0 "Clear the Skies"
 ALI_fortitude_north_desc:0 "An important objective in any modern war is the establishment of, or denial of air supremacy over a region. This was true back then and it is now.\n\nGain §YAnti-Air§! and §YResearch Bonuses§!."
 ALI_god_save_the_king:0 "The Mountain King"
 ALI_god_save_the_king_desc:0 "Alt for Norge! The King was the symbol of the resistance against the Nazis during the Second World War as seen in his initials 'H7' being a popular resistance graffiti.\n\nGain §YHaakon VII§! as your leader, giving §YDivision Speed§! and §YSupply Consumption§! bonuses."
 ### Combined Operations ###
 ALI_royal_commandos:0 "Combined Operations Headquarters"
 ALI_royal_commandos_desc:0 "Who Dares Wins! The Royal Commandos win by deploying their highly trained and skilled forces to prick holes in the enemy's defense at exact points in the frontline. With the Admiral at the helm, little is stopped by their power.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_who_dares_wins:0 "Behind Enemy Lines"
 ALI_who_dares_wins_desc:0 "During the duration of the war, the Royal Commandos often landed behind enemy lines, performing sabotage and capturing vital crossroads ahead of the main thrust of the army arriving on the scenes.\n\nGain an §YIdea§! giving §YSpecial Forces Capacity§! and §YSupply Grace§!."
 ALI_bren_guns:0 "Bren Guns"
 ALI_bren_guns_desc:0 "The Bren Gun a light machinegun used by the Commonwealth during the war. Widely manufactured and distributed, the weapon would become a mainstay of the Commonwealth well beyond the war.\n\nGain §YInfantry Equipment§! and §YSupport Equipment§! bonuses."
 ALI_no1_commandos:0 "No. 1 Commandos"
 ALI_no1_commandos_desc:0 "The first commando unit raised by the British Army during the war, the Commandos would take part in special operations across the world.\n\nThese §YKey Pieces§! excel in naval invasions. Use them to quickly secure bridgeheads."
 ALI_united_we_conquer:0 "United We Conquer"
 ALI_united_we_conquer_desc:0 "The Commandos were often called upon to do amphibious assaults from Norway to Nice through the War, usually supported by the might of the Allies across the Atlantic and Mediterranean coasts of Europe.\n\nGain §YSpecial Forces§! and §YNaval Invasion§! bonuses."
 ALI_long_range_air_infiltration:0 "Long Range Air Infiltration"
 ALI_long_range_air_infiltration_desc:0 "As the war progressed, the infiltration of Eben-Emael became studied increasingly as a way to break defences without heavy losses. While it was abandoned in Germany after Crete, the Allies adopted it instead.\n\nThis §YKey Piece§! specializes in seizing strategic points, backed up by §YHeavy Fighters§!."
 ALI_royal_marines:0 "Royal Marines"
 ALI_royal_marines_desc:0 "The oldest marine regiment still in service in the world, the Royal Marines has fought across the world and they are ready to fight once more.\n\nThese §YKey Pieces§! excel in naval invasions. Use them to quickly secure bridgeheads."
 ALI_mountbatten_at_the_helm:0 "The Ungentlemanly Warrior"
 ALI_mountbatten_at_the_helm_desc:0 "Leading the Combined Operations Headquarters, Louis Mountbatten, a favourite of Churchill's excelled in raids and pinprick operations during the war.\n\nGain §YLouis Mountbatten§! as your leader, giving §YSpecial Forces§! and §YSupply Consumption§! bonuses."
 ### Shared, NOR-UK & Commonwealth ###
 ALI_merchant_marine_escorts:0 "Merchant Marine Escort"
 ALI_merchant_marine_escorts_desc:0 "To keep the Lend-Lease flowing to the USSR during the war, several convoys braved the cold and the wolfpacks to deliver the desperately needed supplies.\n\nGain an §YEscort Fleet§!."
 ALI_deeper_cooperation:0 "Deeper Cooperation"
 ALI_deeper_cooperation_desc:0 "The war might just have started, but our ties go farther back. We must stand together if we are to win this war. Hang together, or hang separately.\n\nGain §YInfantry Equipment§!, §YSupport Equipment§!, §YArtillery§! and §YConvoys§!"
 ALI_joint_strike_force_planning:0 "Joint Strike Force Planning"
 ALI_joint_strike_force_planning_desc:0 ""The Northern Theatre saw a rag-tag coalition of British, Norwegian, Polish and French Forces fighting for Norway's liberation. Utilize the combined resources of exiled governments building up in Britian and take control of the three unique strike forces!"
 ### End Goal ###
 ALI_rupertforce:0 "Everything We Are"
 ALI_rupertforce_desc:0 "While fighting for King and Country, we give everything we are, and everything we will be. United we are strong. United we will win.\n\nThe §YUltimate§! of the Norwegian Tree, giving bonuses to §YSpecial Forces§! and §YCommand Power§!"
 ALI_rupertforce_idea:0 "Everything We Are"
 ALI_rupert_idea_desc:0 ""
 ### ALI The Commonwealth ###
 ALI_commonwelth:0 "The Commonwealth"
 ALI_commonwelth_desc:0 "From across the world, the Commonwealth stands ready. Heeding the call from London, they arrive to fight for what is right in the world.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!"
 ALI_add_commonwelth_units_tt:0 "Adds the §YBritish Fleet§!.\n"
 ALI_add_british_equipment_tt:0 "Adds British Tank, Ship, and Aircraft designs.\n"
 ALI_add_commonwelth_generals_tt:0 "Adds British and Commonwealth §Ygenerals§! and §Ycharacters§!.\n"
 ### Commonwealth 8th Army ###
 ALI_commonwealth_8th_army:0 "Commonwealth 8th Army"
 ALI_commonwealth_8th_army_desc:0 "The Commonwealth 8th Army combines well-supported Infantry, Espionage Tactics and a powerful fleet to hold the line and wait for the opportune moment to counter-attack.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_mediterainian_fleet:0 "Mediterranean Fleet"
 ALI_mediterainian_fleet_desc:0 "One of the oldest formations in the Royal Navy, the Mediterranean Fleet fought against the Regia Marina, and bombarded the French Navy at Mers El-Kebir before attacking Taranto.\n\nGain the §YMediterranean Fleet§!, including §YScreens§! and §YCapital ships§!."
 ALI_cairo_branch:0 "Cairo Branch"
 ALI_cairo_branch_desc:0 "Intelligence remained one of the key fronts upon which the war was fought. The right people at the right time or the correct infiltration could save thousands of lives.\n\nGain 50 §YScout planes§!."
 ALI_anzac_divisions:0 "ANZAC Divisions"
 ALI_anzac_divisions_desc:0 "From across the world, ANZAC divisions have served the Empire for a hundred years. Even with the loss at Gallipoli, tyranny cannot be allowed to live and they will go forth again.\n\nThese §YKey Pieces§! excel in battle against infantry. Use them to hold the line."
 ALI_indian_4th:0 "Indian Gurkhas"
 ALI_indian_4th_desc:0 "The Gurkhas, Nepali volunteers serving in the British Army earned a reputation for unmatched ferocity and fearlessness while serving against the Axis on the frontlines of the war.\n\nThese §YKey Pieces§! are well-suited to punching holes in the enemy front line."
 ALI_desert_air_corps:0 "Desert Air Corps"
 ALI_desert_air_corps_desc:0 "The Desert Air Force was an inter-allied force made up of pilots and planes from across the Allied Nations. Fighting out of Egypt, they took part in the Battle for North Africa.\n\nGain 150 §YSpitfires§!."
 ALI_tank_hunters:0 "Tank Hunters"
 ALI_tank_hunters_desc:0 "In the absence of tanks and planes, the best weapons to counter enemy armour became the bazookas and anti-tank rifles. Dedicated teams would be a potent weapon.\n\nGain §YAnti-tank§! and bonuses to §YInfantry Anti-tank Equipment§!."
 ALI_promote_montgomary:0 "The Spartan Planner"
 ALI_promote_montgomary_desc:0 "A Field Marshal in the British Army, Bernard Montgomery commanded forces in North Africa, before leading the British Army in the invasion of France and later into Germany.\n\nGain §YBernard Montgomery§! as your leader, giving §YArmy§!, §YWeather§! and §YSupply§! bonuses."
 ### Canadian 1st Army ###
 ALI_canadian_1st_army:0 "Canadian 1st Army"
 ALI_canadian_1st_army_desc:0 "The Canadian 1st Army combines Logistical Support and Fast mobile troops to get supplies and men to the lines as fast as possible.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_canadian_1st_armored:0 "Canadian 1st Armored Division"
 ALI_canadian_1st_armored_desc:0 "Formed as an expeditionary infantry division in the First World War, the 1st Armored fought in Italy, replacing the Desert Rats on the frontline, before being sent to join the bulk of the Canadian Army in France.\n\nThis §YKey Piece§! excels at breaking down enemy defenses and advancing through the same gaps."
 ALI_royal_canadian_engineers:0 "Royal Canadian Engineers"
 ALI_royal_canadian_engineers_desc:0 "Reaching its largest extent during the war, the Royal Canadian Engineers served while integrated with the rest of the Canadian expeditionary forces in Europe.\n\nThis §YKey Piece§! is adept at exploiting gaps in the enemy frontline."
 ALI_the_maple_leaf_route:0 "The Maple Leaf Route"
 ALI_the_maple_leaf_route_desc:0 "The nickname for the supply route for Canadian trucks in Normandy, and the site of many victories for the same, the Maple Leaf Route would prove a key supply line for the Allies.\n\nGain bonuses to §YRailroads§!, §YSupply Hubs! and §YSupply§!."
 ALI_together_for_victory:0 "Together For Victory"
 ALI_together_for_victory_desc:0 "During war, the people band together for victory and to protect the homeland. Divisions once seeming vast coming together for a purpose greater than themselves.\n\nThis §YKey Piece§! excel at punching holes in the enemy frontline."
 ALI_cmp:0 "CMP"
 ALI_cmp_desc:0 "The common name for more than 800,000 trucks produced in Canada for use in the Commonwealth armies, the CMP trucks would play a major role in motorizing the armies of the Commonwealth and the USSR.\n\nGain 1500 §YTrucks§!."
 ALI_lessons_from_dieppe:0 "Lessons From Dieppe"
 ALI_lessons_from_dieppe_desc:0 "The Dieppe Raid took place in 1943 as a 'dress rehearsal' for other amphibious operations later in the war. While a colossal failure for tactically, it provided valuable lessons for the Allies going forward.\n\nGain the §YCanadian Escort Fleet§!."
 ALI_promote_simonds:0 "The Logistician"
 ALI_promote_simonds_desc:0 "Considered by several contemporaries as one of the best military leaders of the Second World War, Simonds led forces in Normandy and later into Germany with distinction and success.\n\nGain §YGuy Simonds§! as your leader, giving §YPlanning§! and §YAttack§! bonuses."
 ### End Goal ###
 ALI_rule_britania:0 "Rule Britannia!"
 ALI_rule_britania_desc:0 "Rule, Britannia! Britannia, rule the waves!\nBritons never, never, never shall be slaves.\n\nThe §YUltimate§! of the British tree, gain bonuses to §YIndustry§!, §YCommand Power§!, §YNaval Invasions§! and §YStability§!."
 ### Shared Commonwealth & Canada ###
 ALI_dig_for_victory:0 "Dig for Victory"
 ALI_dig_for_victory_desc:0 "One of the best tanks of the war, the Sherman was nigh-infinitely adaptable and simple to learn. By the end of the war, more than 30 variants existed.\n\nGain 200 §YMedium tanks§! and a design that will be used in armoured divisions"
 ALI_mad_minute_training:0 "Mad Minute Training"
 ALI_mad_minute_training_desc:0 "During both world wars, the Merchant Marine was often called into service to provide deck space for supplies to reach around the world. Forgotten after the war, many only received recognition in the 21st Century.\n\nGain §YEquipment§!."
 ALI_bletchley_park:0 "Bletchley Park"
 ALI_bletchley_park_desc:0 "During both world wars, the Merchant Marine was often called into service to provide deck space for supplies to reach around the world. Forgotten after the war, many only received recognition in the 21st Century.\n\nGain §YEquipment§!."
 ### FRANCE ###
 ALI_french_forces:0 "The French Forces"
 ALI_french_forces_desc:0 "The French Forces"
 ### French Liberation Forces ###
 ALI_french_liberation_army:0 "Armée Française de la Libération"
 ALI_french_liberation_army_desc:0 "France Fell but not their dignity - These heroes of the Early war are back with vengeance in their hearts and Uncle Sam in their pockets. Armed with new Anti-Tank weapons and with years of experience. They're a force to be reckoned with.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_2e_division_blindee:0 "2e Division Blindée"
 ALI_2e_division_blindee_desc:0 "Formed around units that fought in North Africa with Montgomery, the 2nd Armoured Division was reorganized and fought in France, eventually liberating Paris from the German occupation in 1944.\n\nThis §YKey Piece§! excels at smashing fortified lines and other tank divisions."
 ALI_breaking_the_gustav_line:0 "Breaking the Siegfried Line"
 ALI_breaking_the_gustav_line_desc:0 "The Siegfried Line stood as the largest German fortification on the Western Front after the Atlantic Wall. It was breached several times during the final offensives against Germany.\n\nThis §YKey Piece§! specializes in taking mountainous positions."
 ALI_ffi:0 "Forces Françaises de l'Intérieur"
 ALI_ffi_desc:0 "The formal name for the French Resistance during the war, the French Forces of the Interior gradually became light infantry units in the regular French Army as France went from an occupied nation to being liberated by the Allies.\n\nGain bonuses to §YResistance§!, §YRecon§!, §YEquipment capture§! and §YOperations§!."
 ALI_army_of_africa:0 "Armée d'Afrique"
 ALI_army_of_africa_desc:0 "Made up of Arab and Berber volunteers from the French colonies in North Africa, along with descendants of settlers in the same, the Army of Africa was the name for the French Army units stationed in the same.\nGain §YWeekly manpower§!."
 ALI_citroen:0 "Citroën"
 ALI_citroen_desc:0 "Citroën"
 ALI_somua_s35s:0 "SOMUA S35s"
 ALI_somua_s35s_desc:0 "SOMUA S35s"
 ALI_colonel_motors_leader:0 "Colonel Motors Leader"
 ALI_colonel_motors_leader_desc:0 "Colonel Motors Leader"
 ### Army of the Maginot ###
 ALI_army_of_the_maginot:0 "Army of the Maginot"
 ALI_army_of_the_maginot_desc:0 "Army of the Maginot"
 ALI_the_locano_spirit:0 "The Locano Spirit"
 ALI_the_locano_spirit_desc:0 "The Locano Spirit"
 ALI_ZOAN:0 "ZOAN"
 ALI_ZOAN_desc:0 "ZOAN"
 ALI_established_telephone_lines:0 "Established Telephone Lines"
 ALI_established_telephone_lines_desc:0 "Established Telephone Lines"
 ALI_char_de_bataille:0 "Char De Bataille"
 ALI_char_de_bataille_desc:0 "Char De Bataille"
 ALI_folie_a_deux:0 "Folie à deux"
 ALI_folie_a_deux_desc:0 "Folie à deux"
 ALI_prepared_for_a_long_war:0 "Prepared for a Long War"
 ALI_prepared_for_a_long_war_desc:0 "Prepared for a Long War"
 ALI_the_guardian_leader:0 "The Guardian Leader"
 ALI_the_guardian_leader_desc:0 "The Guardian Leader"
 ### FRENCH SHARED AND END GOAL ###
 ALI_legacy_of_french_innovation:0 "Legacy of French Innovation"
 ALI_legacy_of_french_innovation_desc:0 "Though France may have fallen, its legacy lives on in the form of engineers and blueprints that managed to escape following the war. Blueprints put to great use outside of France and increasingly inside of the same.\n\nGain bonuses to §YMechanized§!, §YMotorized§! and §YArmor§!."
 ALI_cross_of_lorraine:0 "Cross of Lorraine"
 ALI_cross_of_lorraine_desc:0 "Cross of Lorraine"
 ALI_free_french_navy:0 "Forces Navales Françaises Libres"
 ALI_free_french_navy_desc:0 "Though most of the Marine Nationale was destroyed at Mers El-Kebir in 1942, some of the French Navy managed to escape to Britain where they joined the Free French inorder to fight against the Axis.\n\nGain a §YFleet§! with §YAircraft Carriers§!"
 ALI_vive_la_france:0 "Vive la France"
 ALI_vive_la_france_desc:0 "Though Metropolitan France may have fallen, France has not. Is defeat final? No! Whatever happens, the flame of the French resistance must not be extinguished and will not be extinguished.\n\nGain §YCharles de Gaulle§! as your leader, giving §YOrganization§!, and §YWar Support§! bonuses."
 ### ALI SHAEF ###
 ALI_us_army:0 "The US Forces"
 ALI_us_army_desc:0 "The umbrella for all things Allied on the Western Front, SHAEF led the invasion of France and Italy, before moving into Germany to meet with the Red Army on the Elbe.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 ### US 12th Army Group ###
 ALI_US_12th_army_group:0 "US 12th Army Group"
 ALI_US_12th_army_group_desc:0 "A balance between medium armor support and overwhelming firepower, The US Army brings the might of America's industry to bear to insure a well rounded and well equipped fighting force.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_smoke_and_ashes:0 "Smoke and Ashes" 
 ALI_smoke_and_ashes_desc:0 "Artillery has always been a cornerstone of warfare ever since the 17th Century when cannons became manueverable to move around on land and ever since the advent of counter-battery fire, it has become more important than ever.\n\nGain §YResearch bonuses§! and §YArtillery§!."
 ALI_p47_strikes:0 "Air-Land Battle"
 ALI_p47_strikes_desc:0 "With the advent of the plane as a factor in battle, securing air superiority for spotting and for close air support became more important thatn ever before, something that would continue into the future.\n\nGain 100 §YP-47§! planes."
 ALI_first_armored:0 "Hell On Wheels"
 ALI_first_armored_desc:0 "Formed as the 1st Armored, also known as 'Old Ironsides' was the first American armoured division to see battle, fighting in North Africa, then in Italy.\n\nThis §YKey Piece§! specializes in breaking through fortified lines of infantry."
 ALI_third_infantry:0 "Big Red One"
 ALI_third_infantry_desc:0 "Named such for its red '1' on its insignia, the 1st Infantry Division fought in both World Wars with distinction, including both North Africa, France and Germany.\n\nThis §YKey Piece§! specializes holding the line against waves of attacks."
 ALI_m1_garand:0 "M1 Garand"
 ALI_m1_garand_desc:0 "The M1 Garand was the standard-issue rifle for American servicemen during the Second World War all the way through the Korean War. It was additionally sent to many other countries througgh Lend-Lease.\n\nGain a bonus to §YInfantry Attack§!."
 ALI_calliopies:0 "Calliopies"
 ALI_calliopies_desc:0 "Based upon the Sherman, the Calliope traded in the maneuverability for a turret-mounted rocket battery to immense psychological effect and suppressive fire.\n\nGain §YResearch bonuses§! to §YRocket Artillery§!."
 ALI_passing_the_torch:0 "Sync Up!"
 ALI_passing_the_torch_desc:0 "Dwight D. Eisenhower, General of the Army was appointed Supreme Allied Commander in 1943 in preparation for the invasion of France, placing great importance on logistics and planning.\n\nGain §YDwight Eisenhower§! as your leader, giving §YCommand power§!, and §YPlanning§! bonuses."
 ### USMC ###
 ALI_USMC:0 "USMC"
 ALI_USMC_desc:0 "When the going gets tough, you call in the Marines. Specialized in amphibious assults, the USMC hit the enemy where they least expect it.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_1st_marine_division:0 "1st Marine Division"
 ALI_1st_marine_division_desc:0 "The oldest division of the United States Marines, the legacy of these soldiers stretches back to the shores of Tripoli. They are now ready to carry this into battle anew.\n\nThese §YKey Pieces§! excel in naval invasions. Use them to quickly secure bridgeheads."
 ALI_11th_marine_artillery:0 "11th Marine Artillery"
 ALI_11th_marine_artillery_desc:0 "Having fought across the world, even Marines need backup once in a while. Once that happens, you call in the artillery and let them bombard the enemy.\n\nThis §YKey Piece§! excels in naval invasions in fortified positions. Use it to quickly secure bridgeheads."
 ALI_with_the_old_breed:0 "With The Old Breed"
 ALI_with_the_old_breed_desc:0 "The Marines can trace their history to some of the first conflicts the United States fought. With such a powerful legacy to live up to, the Marines are the best the United States have.\n\nGain bonuses to §YTraining time§!, §YSpecial Forces§!, §YNaval invasions§! and §YRiver crossings§!."
 ALI_helmet_for_my_pillow:0 "Helmet For My Pillow"
 ALI_helmet_for_my_pillow_desc:0 "War is hell. War is hell, luckily so that we may not grow too fond of it. We must end the war quickly to avoid more hell.\n\nGain bonuses to §YSupply§!."
 ALI_doolittle_raiders:0 "Doolittle's Raiders"
 ALI_doolittle_raiders_desc:0 "As 'payback' for Pearl Harbor, the United States launched a raid on Tokyo using B-25 bombers. Taking off from aircraft carriers, they dealt a great moral blow to Japan.\nGain §YBombers§! and a §YFleet§!."
 ALI_island_hopping_equipment:0 "Island Hopping Equipment"
 ALI_island_hopping_equipment_desc:0 "Throughout the War in the Pacific, the United States followed a strategy of island-hopping, landing on island after island and taking them one by one.\n\nThis §YKey Piece§! specializes in landing on enemy beaches and overcoming the enemy."
 ALI_lords_of_midway:0 "Up and Atom!"
 ALI_lords_of_midway_desc:0 "The leader of the Allies in the Southwest Pacific during the war, Douglas MacArthur led the defence of the Phillippines and its subsequent liberation before accepting the surrender of Japan.\n\nGain Douglas MacArthur as your leader, giving bonuses to §YSpecial Forces§!, §YNaval invasions§! and §YDockyard output§!."
 ### US SHARED AND ENG GOAL ###
 ALI_detroit_arsenal:0 "Detroit Arsenal"
 ALI_detroit_arsenal_desc:0 "As part of the Lend-Lease programmes to several countries outside the Americas, the United States suplied a large amount of light tanks to its allies inorder to bring their mobile divisions up to modern standards.\n\nGain §YLight tanks§! and bonuses to §YReconnaisance§!."
 ALI_general_motors:0 "General Motors"
 ALI_general_motors_desc:0 "Headquartered in the Motor City, the Fisher Body Works built tanks and planes for the war effort during the war alongside the rest of the American industry, such as Ford and General Motors.\n\nGain §YTank destroyers§! and bonuses to §YMedium tanks§! and §YTank destroyers§!."
 ALI_shock_and_awe:0 "Shock and Awe"
 ALI_shock_and_awe_desc:0 "Shock and Awe"
 ALI_arsenal_of_democracy:0 "Arsenal of Democracy"
 ALI_arsenal_of_democracy_desc:0 "The largest advantage the United States held was that it had more industrial strength than the rest of the world combined by 1945, and outproducing all the Axis powers combined in 1940.\n\nThe §YUltimate§! of this tree, gaining bonuses to §YIndustry§!, §YStability§! and §YConsumer Goods§!."
 ### ALI CBI Theater ###
 ALI_cbi:0 "The Chinese United Front"
 ALI_cbi_desc:0 "Called the "Forgotten Theater" of the Second World War, the China-Burma-India Theater saw some of the most brutal fighting and dangerous initiatives of the war.\n\nGives §YAmerican Designs§!."
 ### Nationalist China ###
 ALI_national_revolutionary_army:0 "National Army"
 ALI_national_revolutionary_army_desc:0 "Tracing its origin to 1911, the Chinese army has been fighting longer than any other, and subjected to insurmountable odds. Will the might of the common man and the rifle in their hands be enough to bring you victory?\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_defenders_of_shanghai:0 "Defenders of Shanghai"
 ALI_defenders_of_shanghai_desc:0 "The Battle of Shanghai saw some of the fiercest urban fighting of the Second World War, even rivaling the Battle of Stalingrad in the degree of carnage, including the involvement of elite German-trained divisions.\n\nThese §YKey Pieces§! excel at punching holes in the enemy frontline."
 ALI_fifth_route_army:0 "Fifth Route Army"
 ALI_fifth_route_army_desc:0 "Formed as part of the United Front in 1937, the Eighth Route Army would go on to fight against Japan and later become the nucleus of the People's Liberation Army afterwards.\n\nThese two §YKey Pieces§! stand ready to make the final push against the enemy."
 ALI_mobilise_the_people:0 "Mobilize the People"
 ALI_mobilise_the_people_desc:0 "With the immense population of China, the people are its greatest strength to draw from. People don't just have a mouth, they also have two hands!\n\nGain bonuses to §YRecruitable Population§!, §YTraining time§! and §YMobilization§!."
 ALI_guerilla_warfare:0 "Guerilla Warfare"
 ALI_guerilla_warfare_desc:0 "A landscape might look pacified, but onlt until the soldiers stray from the path. During the war, stay-behind units and partisans took up arms against occupational forces with occasional success.\n\nGain bonuses to §YSupply§!, §YEquipment capture§! and §YArmy§!."
 ALI_jinling_arsenal:0 "Jinling Arsenal"
 ALI_jinling_arsenal_desc:0 "Jinling Arsenal"
 ALI_the_hump:0 "The Hump"
 ALI_the_hump_desc:0 "The supply route over the Himalayas was one of the most dangerous during the war. While not being afflicted with bullets, treacherous weather and winds took the life of many pilots.\n\nGain §YEquipment§! and production bonuses to §YInfantry Equipment§!."
 ALI_united_front:0 "United Front"
 ALI_united_front_desc:0 "The Second United Front was an alliance formed between the KMT and CPC during the Second World War, agreeing to pause the ongoing Chinese Civil War to focus on the Japanese invasion.\n\nChiang Kai-Shek becomes country leader. Gain §YPolitical Power§!, §YExperience§!, §YWar Support§!, §YMax Planning§! and §YCommand Power§!"
