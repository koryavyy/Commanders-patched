 ### CHINA SHARED AND End Goal ###
 ALI_revolutionary_militias:0 "Revolutionary Militias" 
 ALI_revolutionary_militias_desc:0  "[OUTDATED]An Act to Promote the Defence of the United States was how the official title of Lend-Lease began. Through the shipment of trucks, fuel and trains to the USSR and weapons to China, Lend-Lease played an immense role in ending the war.\n\nGain §YMotorized§! and §YMechanized§! bonuses and equipment."
 ALI_flying_tigers:0 "Flying Tigers"
 ALI_flying_tigers_desc:0 "A group of American volunteers fighting in China, the Flying Tigers were some of the first Americans to fight against the Axis in the Second World War.\n\nGain §YResearch Bonuses§! and 100 §YP40 planes§!."
 ALI_western_aid:0 "Western Aid" 
 ALI_western_aid_desc:0 "[OUTDATED]One of the greatest advantages for the Allies throughout the Second World War was the immense oil wealth held by both the USSR and the USA, supplying them with ample fuel compared to the Axis.\n\nGain §YOil§! in your capital province."
 ALI_war_of_resistance:0 "Song of the United Front"
 ALI_war_of_resistance_desc:0 "A War of Resistance was what the Second World War was called in China. The Chinese War of Resistance against Japanese Aggression in long.\n\nThe §YUltimate§! of the Pacific Theatre tree, gain §YRecruitable Population§!, §YDefence§! and §YBreakthrough§!"
 ### ALI Red Army ###
 ALI_soviet_expeditionary_force:0 "Red Army"
 ALI_soviet_expeditionary_force_desc:0 "From the East, the Red Army rises as the mighty giant it is. Use their forces to grind down the enemy on the frontline!\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!"
 ALI_add_sov_equipment_tt:0 "Adds Soviet Tank, Ship, and Aircraft designs.\n"
 ALI_add_SOV_units_tt:0 "Adds the §YSoviet Fleet§!.\n"
 ### 5th Guards Tank Army ###
 ALI_5th_guards_tank_army:0 "5th Guards Tank Army"
 ALI_5th_guards_tank_army_desc:0 "The Soviet 5th Guards Tank Army wins battles through Blood and Iron. Bringing a mix of Armored and Mechanized forces, as well as additional manpower, they make sure every opportunity for a breakthrough can be exploited.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_the_IS_program:0 "The I-S Program"
 ALI_the_IS_program_desc:0 "Designed as breakthrough tanks, the I-S tank programme came as a reaction to the German Tiger tank. The products of the same would be a spearhead in the Battle of Berlin.\n\nGain 200 §YISU-152§! tanks."
 ALI_stalingrad_tractor_plant:0 "Stalingrad Tractor Plant"
 ALI_stalingrad_tractor_plant_desc:0 "During the Second World War, the Stalingrad Tractor Plant was coopted for the war effort against Germany. During the Battle of Stalingrad, it was kept running, the tanks sometimes manned by the same men who built them.\n\nGain production bonuses to §YMedium§! and §YHeavy Tanks§!."
 ALI_roling_dunes:0 "Steel Mountains"
 ALI_roling_dunes_desc:0 "One of the key strengths of the Soviet war machine was the capacity to produce tanks in immense numbers and with greater capacity than the German industrial might.\n\nGain bonuses to §YResearch§! and §YHeavy Tank Production§!."
 ALI_men_for_the_lines:0 "Ring of Steel"
 ALI_men_for_the_lines_desc:0 "Mobilizing the people of the USSR, the Red Army would make extensive use of conscription to push out the German Wehrmacht from the Soviet Union.\n\nGain bonuses to §YRecruitable population§! and §YMechanized§!."
 ALI_first_guards_mechenised:0 "5th Guards Mechanized"
 ALI_first_guards_mechenised_desc:0 "One of the divisions that fought in the Battle of Berlin, the 5th Guards were reformed after originally being destroyed in the initial stages of the German invasion.\n\nThese §YKey Piece§! specializes in holding the lines against enemy infantry."
 ALI_guards_armourd:0 "2nd Tank Corps"
 ALI_guards_armourd_desc:0 "Created in 1943, the 2nd Tank Corps fought from Minsk to Königsberg in the war, including taking part in the Baltic Offensive.\n\nThis §YKey Piece§! specializes in breaking through fortified lines of infantry."
 ALI_marshal_of_victory:0 "Marshal of Victory"
 ALI_marshal_of_victory_desc:0 "Georgy Zhukov, Marshal of the Soviet Union led the defence against Barbarossa in Moscow and Leningrad, before driving the Wehrmacht all the way back to the gates of Berlin.\n\nGain §YKonstantin Roskossovsky§! as a country leader, giving bonuses to §YArmy speed§!, §YArmor§! and §YPlanning§!. Gain submarines."
 ### 3rd Shock Army ###
 ALI_3rd_shock_army:0 "3rd Shock Army"
 ALI_3rd_shock_army_desc:0 "The Soviet 3rd Shock Army brings elite infantry and numbers to the field, attempting to break the enemy lines through sheer force of will and overwhelming battlefield support.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 ALI_79th_rifle_corps:0 "79th Rifle Corps"
 ALI_79th_rifle_corps_desc:0 "The 79th Rifle Corps was formed in 1943 and assigned to the Baltic Front, pushing through to Berlin. Soldiers amongst the corps were those who stormed the Reichstag in the final days of the war.\n\nThese §YInfantry Divisions§! are §YKey Pieces§! to bolster your frontline."
 ALI_8th_motor_rifle_brigade:0 "Stalin's Organ"
 ALI_8th_motor_rifle_brigade_desc:0 "A Dear Child has Many Names. The Soviet truck-mounted multiple rocket launchers got many nicknames during the war, including Katyushas and Stalin Organs (for their sound)\n\nGain §YMotorized Rocket Artillery§! with bonuses and two §YKey Piece§! divisions excelling in speedy breakthroughs against infantry."
 ALI_the_vdv:0 "The VDV"
 ALI_the_vdv_desc:0 "The Air-landing Forces of the Armed Forces were formed during the Second World War and would take part in the Battle of the Dniepr and Manchuria.\n\nThese §YKey Pieces§! specializes in seizing strategic points."
 ALI_arm_local_militias:0 "Arm Local Militias"
 ALI_arm_local_militias_desc:0 "Where there are people, there might be a gun. Where there might be a gun, there will be a partisan. And where there is a partisan, there are problems for the enemy.\n\nThese §YKey Pieces§! are good for plugging holes in your line."
 ALI_armored_trains:0 "Armored Trains"
 ALI_armored_trains_desc:0 "During and after the Russian Civil War, the Red Army made use of armored trains to transport high-ranking commanders and soldiers to and from the front.\n\nGain §YTrains§!."
 ALI_short_range_bombing_equipment:0 "128th Short Range Bombing Regiment"
 ALI_short_range_bombing_equipment_desc:0 "A core component of modern warfare, especially in shock troops has been close air support. Suppressing various forces from above, and supporting friendly forces in their advances has proven to be crucial.\n\nGain 150 §YIl-2§! planes."
 ALI_the_chain_breaker:0 "The Chain Breaker"
 ALI_the_chain_breaker_desc:0 "Georgy Zhukov, Marshal of the Soviet Union led the defence against Barbarossa in Moscow and Leningrad, before driving the Wehrmacht all the way back to the gates of Berlin.\n\nGain §YGeorgy Zhukov§! as a country leader, giving bonuses to §YOrganization§!, §YReinforce rate§! and §YEncirclements§!."
 ### End Goal ###
 ALI_red_october:0 "Red October"
 ALI_red_october_desc:0 "Georgy Zhukov, Marshal of the Soviet Union led the defence against Barbarossa in Moscow and Leningrad, before driving the Wehrmacht all the way back to the gates of Berlin.\n\nGain §YKonstantin Roskossovsky§! as a country leader, giving bonuses to §YArmy speed§!, §YArmor§! and §YPlanning§!. Gain submarines."
 ALI_ural_automative_plant:0 "Ural Automative Plant"
 ALI_ural_automative_plant_desc:0 "Ural Automative Plant"
 ALI_red_pilots:0 "Red Pilots"
 ALI_red_pilots_desc:0 "One of the premier centerpieces of the Soviet Union during the war, the Soviet Air Forces advanced considerably during the 1930's before facing its greatest test against the Axis on the Eastern Front.\n\nGain bonuses to §YAir Production Cost§!"
 ALI_no_step_back:0 "No Step Back"
 ALI_no_step_back_desc:0 "Order 227 of the People's Commissar from Defence "Not one step back!" Such should now be our main slogan.\n\nThe §YUltimate§! of the Soviet Tree, gain an idea giving §YAttack§!, §YSupply§!, §YOrganization§!, §YRecovery§! and §YStability§! bonuses."
 
