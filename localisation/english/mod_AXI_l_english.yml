 AXI_the_wolf:0 "The Wolf"
 AXI_the_wolf_desc:0 "The Wolf"
 ### SHARED OKH
 AXI_silent_hunters:0 "Silent Hunters"
 AXI_silent_hunters_desc:0 "Hunting underneath the waters, the Wolfpacks of the Axis hunted cargo ships carrying material from the factories to the consumer with devastating effect during the first half of the war.\n\nGain 20 §YSubmarines§! (Type VII)."
 AXI_silent_hunters_tt:0 "Adds §Y25 Submarines§!."
 AXI_mauser:0 "Mauser"
 AXI_mauser_desc:0 "Mauser"
 AXI_mefo:0 "Mefo"
 AXI_mefo_desc:0 "Mefo"
 AXI_case_by_case:0 "Case by Case"
 AXI_case_by_case_desc:0 "Case by Case"
 ### AXI Royal Italian Army ###
 AXI_royal_italian:0 "Royal Italian Army"
 AXI_royal_italian_desc:0 "As one of the main Axis Powers, Italy was the main opponent of the Allies in the Mediterranean Sea, both at sea, as well as on land.\nItaly surrendered in 1943.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 AXI_add_italian_equipment_tt:0 "Adds Italian Tank, Ship, and Aircraft designs.."
 AXI_add_italian_units_tt:0 "Adds the §YItalian Fleet§!."
 ### First Army ###
 AXI_army_of_north_africa:0 "1st Army"
 AXI_army_of_north_africa_desc:0 "Combining Artillery and Naval Support, The Italian Army 1st Army provides a good mix of Air, Land and Sea power to hold the line and whittle down enemy forces.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_32nd_tank_infantry_regiment:0 "132ª Divisione Corazzata "Ariete""
 AXI_32nd_tank_infantry_regiment_desc:0 "In reality, an armored, rather than an artillery regiment, the 132nd was sent to Libya to reinforce positions there following a defeat in the early part of 1941 alongside the Afrika Korps. However, during the battle of El-Alamein, the regiment was destroyed.\n\nThese §YKey Pieces§! excel against entrenched infantry."
 AXI_32nd_tank_infantry_regiment_tt:0 "Adds §Y3 32 Width Motorized Light Tank Divisions§!."
 AXI_132nd_artillery_regiment:0 "132° Reggimento Artiglieria Terrestre"
 AXI_132nd_artillery_regiment_desc:0 "In reality, an armored, rather than an artillery regiment, the 132nd was sent to Libya to reinforce positions there following a defeat in the early part of 1941 alongside the Afrika Korps. However, during the battle of El-Alamein, the regiment was destroyed.\n\nThese §YKey Pieces§! excel against entrenched infantry."
 AXI_132nd_artillery_regiment_tt:0 "Adds §Y3 24 Width Mountaineer Divisions§!."
 AXI_aces_of_the_sands:0 "Aces of the Sands"
 AXI_aces_of_the_sands_desc:0 "In the deserts of North Africa, planes often got a very good look at the enemy due to the lack of trees and other formations that could hide formations and positions from the air. That was also true for anti-air emplacements.\n\nGain §YFighters§!."
 AXI_italian_planes_tt:0 "Adds §Y150 Fighters§! (Re.2000 variant)."
 AXI_aeronautica_machta:0 "Aeronautica Macchi"
 AXI_aeronautica_machta_desc:0 "Formed in 1912 to build planes under license, Aeromacchi began later to branch into their own designs, specializing in small two-seater planes, with a brief foray into motorcycles later after the war.\n\nGain bonuses to §YAir research§!."
 AXI_aeronautica_machta_tt:0 "Will add §G+40.00%§! research speed to all air research."
 AXI_tankettes:0 "Tankettes"
 AXI_tankettes_desc:0 "Known as a kind of discount tank, tankettes became popular in the interwar as a way to obtain armoured force on a budget, but with the unfortunate result of being outdated by the time of the Second World War.\n\nGain bonuses to §YLight tanks§!."
 AXI_special_forces_training:0 "Special Forces Training"
 AXI_special_forces_training_desc:0 "While the fighting the environment and the opponments occasionally demanded soldiers of a special kind in order to face the conditions that the battles required of the armies involved.\n\nGain bonuses to §YSpecial forces§!."
 
 AXI_supreme_commander:0 "Angel of Conquest"
 AXI_supreme_commander_desc:0 "One of a select few Marshals of Italy, Giovanni Messe led Italian soldiers in Greece and Russia before being sent to Tunisia in attempt to stem the bleeding there, being captured there in 1943.\n\nGain §YGiovanni Messe§! as your leader, giving §YPolitical Power§!, §YConsumer Goods§!, §YResistance§! and §YGarrison§! bonuses."
 ### Armata del Po ###
 AXI_army_of_the_po:0 "Armata del Po"
 AXI_army_of_the_po_desc:0 "Fast, Light forces that adopt raiding and hit and run tactics across Air, Land and Sea. If you want to be somewhere quick, the Army of the Po are your troops of choice.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_101st_motorized:0 "101st Motorized "Trieste""
 AXI_101st_motorized_desc:0 "Formed in 1935 as the 1st Motorized, later renamed to the 102nd, the 102nd Division saw combat in France and later in Libya and at Tobruk as part of the 1st Army. However, having been outmaneuvered at El Alamein, the division was lost.\n\nThis §YKey Piece§! is adept at exploiting gaps in the enemy frontline."
 AXI_italian_motorized_tt:0 "Adds §Y3 20-Width Motorized Division§!."
 AXI_102nd_motorized:0 "102nd Motorized "Trento""
 AXI_102nd_motorized_desc:0 "Formed in 1935 as the 1st Motorized, later renamed to the 102nd, the 102nd Division saw combat in France and later in Libya and at Tobruk as part of the 1st Army. However, having been outmaneuvered at El Alamein, the division was lost.\n\nThis §YKey Piece§! is adept at exploiting gaps in the enemy frontline."
 AXI_italian_motorized_arty_tt:0 "Adds §Y2 30-Width Motorized Artillery Divisions§!."
 AXI_speedy_corps:0 "Establish the Fast Corps"
 AXI_speedy_corps_desc:0 "As part of the Italian army in North Africa, the Fast Corps was responsible for the vast majority of maneuver warfare by the Italian army due to the distances and harsh climate in the desert.\n\nGain bonuses to §YFuel consumption§!, §YSpeed§!, §YRecovery rate§! and §YMotorized§!."
 AXI_decima_flotilla:0 "Decima Flotilla MAS"
 AXI_decima_flotilla_desc:0 "Consisting of frogmen, torpedo boats and submarines, the Decima Flotilla raided several Allied harbours during the war with devastating effect.\n\nGain §YSubmarines§!."
 AXI_decima_flotilla_tt:0 "Adds §Y15 Submarines§!."
 AXI_alfa_romero:0 "Alfa Romero"
 AXI_alfa_romero_desc:0 "Producer of cars and planes both before and during the war, Alfa Romero produced engines for all kinds of vehicles during the war with great effect.\n\nGain production bonuses to §YMotorized§! and §YFighters§!."
 AXI_colonial_garrison:0 "Colonial Garrison"
 AXI_colonial_garrison_desc:0 "As with many other countries with colonies during the Second World War, Italy would enlist a large number of indigenous people living in their colonies as auxilliary troops.\n\nThese §YKey Pieces§! are suited to substituting for other troops where needed."
 AXI_colonial_garrison_tt:0 "Adds §Y10 Colonial Irregular Divisions§!."
 AXI_supremo_graziana:0 "Like Lightning"
 AXI_supremo_graziana_desc:0 "Instrumental in the conquest of Ethiopia in the 1930s, Rodolfo Graziani became infamous for his harsh methods and even more brutal reprisal, earning him the nickname of 'The Butcher of Fezzan'.\n\nGain §YRodolfo Graziana§! as your leader, giving §YSupply§! and §YHeat attrition§! bonuses."
 ### End Goal ###
 AXI_by_blood_alone:0 "By Blood Alone"
 AXI_by_blood_alone_desc:0 "Solely by blood, the army presses on. Solely by blood, solely by the blood and iron of the kingdom and the Empire. Let the world tremble!\n\nThe §YUltimate§! of the Italian tree, giving bonuses to §YAir superiority§!, §YAir CAS§! and §YDivision Attack§!"
 ### Shared, Royal Italian Army & Japanese Imperial Military ###
 AXI_the_breakout_fleet:0 "The Breakout Fleet"
 AXI_the_breakout_fleet_desc:0 "Designed to break through a possible Allied blockade of Italy and past Gibraltar with the goal of operating on the high seas. It failed.\n\nGain a §YFleet§! with §YBattleships§!."
 AXI_the_breakout_fleet_tt:0 "Adds a §YFleet§! with §Y3 Battleships§!."
 AXI_intergrated_axis_command:0 "Integrated Axis Command"
 AXI_intergrated_axis_command_desc:0 "While never more than a number of countries with aligned interests and their puppets compared to the Allies, a few joint operations did happen during the course of the Second World War., including between Germany and Italy.\n\nGain §YGenerals§! and a bonus to §YManpower§!."
 AXI_intergrated_axis_command_tt:0 "Adds additional Italian or German §YGenerals§!."
 AXI_canned_rations:0 "Canned Rations"
 AXI_canned_rations_desc:0 "As one of the most brutal environments of the Second World War, the deserts of North Africa and the jungles of Southeast Asia demanded special equipment and sometimes even also training.\n\nGain bonuses to §YClimate adaptation§! and §YSupply§!."
 ### AXI Japanese Imperial Military ###
 AXI_IJA:0 "Imperial Japanese Military"
 AXI_IJA_desc:0 "The main opponent to the NRA and to the United States, the Imperial Japanese military fought tooth and nail for every inch of land and every feet of water.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 AXI_add_japanese_equipment_tt:0 "Adds Japanese Tank, Ship, and Aircraft designs."
 AXI_add_japanese_units_tt:0 "Adds the §YJapanese Fleet§!."
 ### Imperial Japanese Navy ###
 AXI_imperial_japanese_navy:0 "Imperial Japanese Navy"
 AXI_imperial_japanese_navy_desc:0 "Providing Expert Naval Support, Special Forces and powerful Infantry, The Japanese Expeditionary Force relies on dominating the waterways and striking the enemy lines where they least expect it.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_2nd_snlf:0 "2nd Maizuru SNLF"
 AXI_2nd_snlf_desc:0 "Part of the land component of the IJN, the 2nd Maizuru SNLF would be one of the units taking part in the first phase of the Pacific War, storming Wake Island against the USMC.\n\nThis §YKey Piece§! excels in storming enemy beaches and seizing a foothold on dry land."
 AXI_2nd_snlf_tt:0 "Adds §Y2 Elite Large Infantry Divisions§!."
 AXI_4th_snlf:0 "3rd Yokosuka SNLF"
 AXI_4th_snlf_desc:0 "As part of the Japanese naval land units, the 3rd Yokosuka SNLF would be one of the units storming the Phillippines in 1941, fighting against MacArthur\n\nThis §YKey Piece§! excels in storming enemy beaches and seizing a foothold on dry land."
 AXI_4th_snlf_tt:0 "Adds §Y2 18-Width Elite Marine Divisions with Support Companies§!."
 AXI_fund_the_katsu:0 "Fund the Katsu"
 AXI_fund_the_katsu_desc:0 "Fund the Katsu"
 AXI_naval_aviation:0 "Naval Aviation"
 AXI_naval_aviation_desc:0 "As one of the pioneers in the practice of naval aviation and carriers, the IJN would deploy these inventions to devastating effect at Pearl Harbor, sinking several capital ships in the process.\n\nGain §Y100§! B5N Naval Bombers."
 AXI_naval_aviation_tt:0 "Adds §3150 Naval Bombers§! (B5N variant)."
 AXI_tokyo_express:0 "Tokyo Express"
 AXI_tokyo_express_desc:0 "Delivering supplies under the cover of night, the Tokyo Express was a nickname given by Allied soldiers to IJN destroyers and submarines delivering supplies without being detected.\n\nGain bonuses to §YSpecial Forces§!, §YNaval Invasions§! and §YConvoy Escorts§!."
 AXI_great_harmony:0 "Great Harmony"
 AXI_great_harmony_desc:0 "The Battleship Yamato was the largest battleship built and functioning. Nicknamed the Hotel Yamato (for its, in comparison, luxurious commendations), it was sunk by American planes at Okinawa.\n\nThis §YKey Piece§! excels in breaking through enemy capital ships."
 get_yamato_bote:0 "Adds the §YBattleship Yamato§! and five §YCruisers§!."
 AXI_yamamoto_supreme:0 "Supremacy of the Navy"
 AXI_yamamoto_supreme_desc:0 "Having planned the attack on Pearl Harbor, Isoroku Yamamoto would later say that they had done nothing but 'awaken a sleeping giant'. He would not live to see such, being killed in an American attack in 1943.\n\nGain §YIsoroku Yamamoto§! as your leader, giving §YNaval invasion§!, and §YFleet coordination§! bonuses."
 ### Imperial Japanese Army ###
 AXI_IJ_army:0 "Imperial Japanese Army"
 AXI_IJ_army_desc:0 "Expert Infantry and a Warrior spirit go a long way. The Imperial Japanese Military are experts at utilizing every soldier available and an unrelenting moral to defeat all who stand in their way.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_18th_chrysanthemum_division:0 "18th Chrysanthemum Division"
 AXI_18th_chrysanthemum_division_desc:0 "Activated before the First World War, the 18th Division would see combat across the Western Pacific, including China and Malaysia before ending the war in Burma, surrendering there in 1945.\n\nThese §YKey Pieces§! excel in exploiting the gap between leg infantry. Use them to cement the gains in your line."
 AXI_japanese_soldiers:0 "Adds §Y2 26-Width Infantry Divisions with Field Hospitals§!."
 AXI_bicycle_messengers:0 "Bicycle Messengers"
 AXI_bicycle_messengers_desc:0 "During the Fall of Singapore, the British garrison was taken aback when it was discovered that the attack was not coming from the sea, but instead by land, mounted on bicycles.\n\nThese §YKey Pieces§! are fuel-efficient, and can reach positions before the enemy."
 AXI_bicycle_messengers_tt:0 "Adds §Y3 Bicycle Infantry Divisions§!."
 AXI_arisaka:0 "Arisaka"
 AXI_arisaka_desc:0 "Influenced by the Mauser, the Arisaka-design rifle was a mainstay of the IJA throughout the first half of the 20th Century, seeing service from the Russo-Japanese War, to the First and Second World Wars.\n\nGain bonuses to §YInfantry attack§!."
 arisaka_cic_tt:0  "Enables §HArisaka§!\n§HInfantry§!:\n    Soft attack: §G+10.00%§!"
 AXI_62nd_stone_division:0 "62nd Stone Division"
 AXI_62nd_stone_division_desc:0 "Formed to replace independent auxillaries, the 62nd Division was assigned to fight in China in 1944, however, it was withdrawn to Taiwan, and then assigned to defend Okinawa in April 1945 where it was destroyed by the USMC.\n\nThese §YKey Pieces§! are excellent at reinforcing battles nearby."
 AXI_japanese_soldiers2:0 "Adds 2 §Y26-Width Infantry Divisions with Field Hospitals§!."
 AXI_warrior_spirit:0 "Warrior Spirit"
 AXI_warrior_spirit_desc:0 "As part of the training in the IJA, soldiers were trained to see themselves as beyond and above the people they fought. Another aspect was the esprit d'corps, encouraged and brutally instilled.\n\nGain bonuses to §YInfantry defence§!."
 AXI_spiritual_mobilization:0 "Spiritual Mobilization"
 AXI_spiritual_mobilization_desc:0 "During the Second World War, even religion was not safe from mobilization. The spiritual fabric of Japan was made into a tool for the war machine, without hesitation or regret by the government.\n\nGain bonuses to §YRecruitable Population§!. and §YMobilization§!"
 AXI_terauchi_supreme:0 "Supremacy of the Army"
 AXI_terauchi_supreme_desc:0 "Commander of the Southern Expeditionary Army during the war, the 2nd Count Terauchi led the attacks on Indonesia and Burma. He never stood trial.\n\nGain §YHisaichi Terauchi§! as your leader, giving §YCommand Power§!, and §YPlanning§! bonuses."

 ### End Goal ###
 AXI_carriers_through_the_staits:0 "Carriers Through the Straits"
 AXI_carriers_through_the_staits_desc:0 "Pioneers in the concept of aircraft carriers, the Japanese military would employ these to devastating effect. across the war.\n\nGain A §YFleet§! with §YCarriers§!."
 AXI_carriers_through_the_staits_tt:0 "Adds a §YFleet§! with §Y3 Aircraft Carriers§!."
 AXI_banzai:0 "Banzai"
 AXI_banzai_desc:0 "Banzai"
 AXI_skimp_on_resources:0 "Skimp on Resources"
 AXI_skimp_on_resources_desc:0 "Due to the blockades and demand for war material, the Japanese people had to make do with much less normally vital material. This would also extend to the grunt garrison soldier, to their dismay.\n\nGain bonuses to §YAircraft production§!."
 
 AXI_samurai_of_the_sands:0 "Modern Bushido"
 AXI_samurai_of_the_sands_desc:0 "During the War, the Japanese military saw itself as the inheritors to the legacy of the samurai, and adopted several concepts from their history, updating them to fit.\n\nThe §YUltimate§! of the Japanese tree, giving bonuses to §YWar support§!, §YRecovery rate§! and §YNaval damage§!."


