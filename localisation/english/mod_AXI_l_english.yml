l_english:
 ### copy AXI_:0 ""
 ### Leader Names and Traits ###
 AXI_winter_is_coming:0 "Winter is Coming"
 AXI_winter_is_coming_desc:0 "The Winter War, one of the forgotten sideshows to the Second World War saw Finland fight against the Soviet Union for contorl of the contested region of Karelia.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 AXI_add_finnish_equipment_tt:0 "Adds Finnish Tank, Ship, and Aircraft designs."
 AXI_add_finnish_units_tt:0 "Adds the §YFinnish Fleet§!."
 ### Special ###
 AXI_deeper_cooperation:0 "Deeper Cooperation"
 AXI_deeper_cooperation_desc:0 "Benefactors abroad have sent support pouring into Finland against the USSR. Money, weapons and more, and all will be put to good use.\n\nGain §YArtillery§!, §YInfantry equipment§! and §YSupport equipment§!."
 AXI_ski_infantry:0 "Ski Infantry"
 AXI_ski_infantry_desc:0 "Ski Infantry"
 AXI_hakka_paalle:0 "Hakkaa Päälle"
 AXI_hakka_paalle_desc:0 "Hakkaa Päälle"
 ### North Finland Group ###
 AXI_from_abroad:0 "North Finland Group"
 AXI_from_abroad_desc:0 "All across Scandinavia, people gathered to the call of Finland. Let the full amount of all the jury-rigged vehicles crush your adversaries and call in aid from abroad to make sure that the Marshall of Finland secures a quick victory.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_the_sturmi:0 "A Finnish Panssaridivisioona"
 AXI_the_sturmi_desc:0 "Scrounging up what we can from around the world, from around the scrapyards and what is available on the open market, maybe, maybe it is possible for us to create our own armoured division.\n\nThis §YKey Piece§! is fragile, but hits hard against enemy fortifications."
 #AXI_the_sturmi_tt:0 "Adds the §YBT-42§!, §YStuG III Ausf. G§!, §YLandsverk L-62§!, and §YKV-1§! tank templates and a §Y 32-width Mixed Armoured Division§! with motorized, mechanized, and supports."
 AXI_the_sturmi_tt:0 "Adds the §YBT-42§!, §YStuG III Ausf. G§!, §YLandsverk L-62§!, and §YKV-1§! tank templates and a §Y 32-width Mixed Armoured Division§! with motorized, mechanized, and supports."
 AXI_the_old_neighbor:0 "Svenska Frivilligkåren"
 AXI_the_old_neighbor_desc:0 "The Swedish Volunteer Corps was an army of 8,260 Sweeds, 75 Norwegians, and 600 Danes who volunteered to help Finland in the Winter War.\n\nGain §YWeekly Manpower§!."
 AXI_fjords_and_fields:0 "Operation Silver Fox"
 AXI_fjords_and_fields_desc:0 "A joint assault on the port of Murmansk, a vital lifeline for the Soviet Union, Operation Silver Fox, planned to capture the city, but failed.\n\nGain bonuses to §YCommand Power§!, §YPlanning§! and §YArmy speed§!."
 AXI_volunteers_for_the_homeland:0 "Call Up the Reserves"
 AXI_volunteers_for_the_homeland_desc:0 "During the Winter War, the Finnish Army cleared the frontier. An old woman, whose house was to be destroyed took time to clean it, then set it alight herself with the words 'This is my gift to Finland'.\n\nThese §YKey Pieces§! excel in battle against infantry. Use them to hold the line."
 AXI_pilots_and_planes:0 "Pilots and Planes"
 AXI_pilots_and_planes_desc:0 "In any modern war, the plane has risen to a higher level of responsibility than ever before. The ability to spot what lies ahead and above has proven a key issue.\n\nGain 150 §YFocke-Wulf 190§! and §Y100 Air Experience§!."
 AXI_the_finland_collection:0 "Operation Arctic Fox"
 AXI_the_finland_collection_desc:0 "Conducted as a joint Finno-German operation, Operation Arctic Fox aimed to cut off the railline to Murmansk with the hope of strangling Lend-Lease, but with no success.\n\nGain bonuses to §YRecovery rate§! and §YOut of Supply§!."
 AXI_marshall_of_finland:0 "The Marshall"
 AXI_marshall_of_finland_desc:0 "Carl Gustaf Mannerheim, born a Russian subject in 1867 but choosing his native Finland over Russia during the Russian Civil War, eventually becoming the commander-in-chief of the Finnish Army.\n\nGain §YCarl Gustaf Mannerheim§! as your leader, giving §YAttack§!, and §YDefense§! bonuses."
 ### Army of the Isthmus ###
 AXI_from_within:0 "Army of the Isthmus"
 AXI_from_within_desc:0 "On the frontlines against the Red Menace, the Army of the Isthmus specializes in making life difficult for an army on the offensive. Channel the Spirit of the White Death and let the enemy pay dearly in lives for each inch they gain.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_finnish_air_defence:0 "Finnish Air Defence"
 AXI_finnish_air_defence_desc:0 "To counter the Russian aircraft, one possible way is to hit the planes from the ground, before they can hit the army from above. As they say, the best defense is a good offense.\n\nGain §YTowed Anti-air§! and §YResearch bonuses§!."
 AXI_sami_rangers:0 "Sámi Rangers"
 AXI_sami_rangers_desc:0 "The original people of Northern Scandinavia, the Sámi have always been adept at surviving in the wilderness of the North.\n\nThese §YKey Pieces§! stand ready to make the final push against the enemy."
 AXI_sami_rangers_tt:0 "Adds §Y4 21-Width Light Infantry Divisions§!."
 AXI_spirit_of_the_white_death:0 "Spirit of the White Death"
 AXI_spirit_of_the_white_death_desc:0 "Simo Häyhä, born 1905, one of the most effective snipers in world history, estimated to have killed over 500 Soviet soldiers during the Winter War.\n\nGain bonuses to §YSpecial Forces§!, §YArmy speed§! and §YAir superiority mitigation§!."
 AXI_molotov_cocktails:0 "Molotov Cocktails"
 AXI_molotov_cocktails_desc:0 "A drink to go with Molotov's food parcels. Perfectly good at warming up tanks on a cold day. And also the people inside. Especially the people inside. To a very high degree.\n\nGain §YInfantry§! bonuses."
 AXI_molotov_cocktails_tt:0 "Enables §HMolotov Cocktails§!\n§HInfantry\n    Hard Attack: §G+100%§!\n    Piercing: §G+300%§!\n"
 AXI_civil_guards:0 "Countering Soviet Armor"
 AXI_civil_guards_desc:0 "During the Winter War, the Soviets used tanks against Finnish positions, with no obvious counter from Finland. In the absence of armour, alternative measures were used.\n\nGain bonuses to §YAnti-tank§! §YHard attack§!, §YPiercing§! and §YProduction cost§!"
 AXI_motti:0 "Motti Tactics"
 AXI_motti_desc:0 "A name for a pile of firewood, 'Motti' would be employed by Finland to box in Soviet troops before shelling them from hidden artillery positions.\n\nGain bonuses to §YSupply§!, §YEquipment capture§! and §YEncirclements§!."
 AXI_appoint_motti_matti:0 "The Thorn"
 AXI_appoint_motti_matti_desc:0 "Known as Motti-Matti for his use of Motti tactics against the Red Army during the Second World War, Maati Aarnio would later help Lauri Torni gain entry to the United States.\n\nGain §YMaati Aarnio§! as your leader, giving §YEntrenchment§!, and §YPlanning§! bonuses."
 ### End Goal ###
 AXI_sisu:0 "Sisu"
 AXI_sisu_desc:0 "Another word for stoicism, bravery and resilience in Finland, 'Sisu' is held in Finland to express their national character, and occasionally stubbornness if taken too far towards a bad end.\n\nThe §YUltimate§! of the Finland tree, giving bonuses to §YCore attack§!, §YAttrition§!, §!Recovery rate§! and §YRecruitable population§!."
 ### Shared, Finland & Hungary Romania ###
 AXI_anti_soviet_cooperation:0 "Anti-Soviet Cooperation"
 AXI_anti_soviet_cooperation_desc:0 "During the Winter War and the later Continuation War, frequent collaboration took place between the Axis Powers and their co-belligerents, including Finland, in order to better both powers.\n\nGain §Y400§! Mechanized and Trucks"
 AXI_adopt_german_designs:0 "Adopt German Designs"
 AXI_adopt_german_designs_desc:0 "Adopt German Designs"
 AXI_adopt_german_designs_tt:0 "§Y150 Panzer IV Ausf. H§! improved medium tanks are added to the national stockpile.\n"
 AXI_italian_naval_support:0 "Italian Naval Support"
 AXI_italian_naval_support_desc:0 "Italian Naval Support"
 AXI_italian_naval_support_tt:0 "Adds a §YFleet§! with a §YBattleship§!"
 ### AXI Hungary Romania ###
 AXI_hr_start:0 "Hungary-Romania"
 AXI_hr_start_desc:0 "The fourth and fifth Axis Powers. Hungary used German support to grow its economy and regain territory lost in the Great War. Romania while original neutral, under mounting internal and external pressure turned to Germany for protection from the Soviet Union.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 AXI_add_hungarian_equipment_tt:0 "Adds Hungarian and Romanian Tank, Ship, and Aircraft designs."
 AXI_add_hungarian_units_tt:0 "Adds the §YBlack Sea Fleet§!."
 ### Hungary ###
 AXI_hungary:0 "Honvédség"
 AXI_hungary_desc:0 "The Royal Hungary Army (Magyar Királyi Honvédség) played a vital role during the invasion of the Soviet Union. They lead the attack across the Carpathians into Ukraine and played a vital role during Fall Blau. The army was finally destroyed during the Siege of Budapest.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_modern_hussars:0 "Modern Hussars"
 AXI_modern_hussars_desc:0 "Hussars are a form of light cavalry that have played a vital role in European armies since the 17th Century. They were based on the style and fighting style of traditional Hungarian Cavalry.\n\nThese §YKey Pieces§! are fuel-efficient, and can reach positions before the enemy."
 AXI_modern_hussars_tt:0 "Adds §Y2 18-Width Bicycle Divisions§!\nAdds §Y2 15-Width Motorized Divisions§!\n"
 AXI_hungarian_armord_divisions:0 "Hungarian Armor"
 AXI_hungarian_armord_divisions_tt:0 "Adds a §Y32-width Armored Division§!.\n"
 AXI_hungarian_armord_divisions_desc:0 "Hungarian Armoured Divisions played a key role during the war. These forces were made up of Hungarian-made tanks supplemented with German Panzer IVs, Tigers, Panthers, and Hetzers.\n\nThis §YKey Piece§! specializes in breaking through fortified lines of infantry."
 AXI_hungarian_industry:0 "MÁVAG"
 AXI_hungarian_industry_desc:0 "Hungarian Royal State Iron, Steel and Machine Factories was the second largest industrial corporation in Hungary. From its factory complex in Budapest, it produced vital war material during the Second World War.\nGain a bonus to §YIndustry.§!"
 AXI_legacy_of_atilla:0 "Legacy of Attila"
 AXI_legacy_of_atilla_desc:0 "Hungary is a melting pot of ancient war-like nomadic peoples including Huns, Avars, and Magyars. During the 1930s this legacy was encouraged as part of its national spirit.\n\nGain a significant bonus to §YCavalry§!, §YMotorized§!, and §YMechanized§! battalions."
 AXI_legacy_of_atilla_tt:0 "Enables §HLegacy of Attila§!\n§HCavalry\n    Organization: §G+20§!\n    Recovery Rate: §G+20%§!\n    Breakthrough: §G+20%§!"
 AXI_hungarian_cavalry:0 "Hungarian Cavalry"
 AXI_hungarian_cavalry_desc:0 "Hungarian Cavalry has been renowned across Europe for centuries. During the Second World War, each Hungarian Army Corps had a minimum of Two Cavalry Brigades attached, along with motorised and Cavalry Reconnaissance units.\nThese §YKey Pieces§! can rapidly exploit gaps in the frontline. Synergises with Legacy of Attila."
 AXI_civil_guards_tt:0 "Adds §Y5 18-Width Cavalry Divisions§!."
 AXI_hungarian_panthers:0 "Hungarian Panthers"
 AXI_hungarian_panthers_desc:0 "Hungary had its own tank production programme during the war. These included many home-produced designs such as the Toldi and Turan tank lines, Zrinyi assault guns, and Nimrod SPAA gun.\n\nGain bonuses to §YTank Production§! and §YResearch§!."
 AXI_the_regent_admiral:0 "The Black Hussar"
 AXI_the_regent_admiral_desc:0 "Miklós Horthy was a Hungarian admiral and regent of Hungary. Under his rule Hungary joined the Axis Powers and partake in the invasion of the Soviet Union. However, in October 1944 he sued for peace with the Allies, only to be forced out of power by German forces.\nGain §YMiklós Horthy§! as your leader, giving §YOrganisation§!, and §YSpeed§! bonuses."
 ### Romania ###
 AXI_romania:0 "Armata a 4-a Română"
 AXI_romania_desc:0 "The Romanian 4th Army was the main Romanian Army during the invasion of the Soviet Union. It contained 17 Infantry Divisions, 1 Armoured Divison, and 3 Cavlary Divisions. The army was destroyed during the Battle of Stalingrad.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_romanian_artillery:0 "Artillery Primacy"
 AXI_romanian_artillery_desc:0 "The Romanian Army had a vast arsenal of artillery due to the lessons learned during the Great War. Artillery in support of infantry attacks was a vital part of Romanian military doctrine.\n\nGain §Yproduction§! bonuses to §YArtillery§!, §YAnti-tank§!, and §YAnti-air§!. Gain §Yequipment§!."
 AXI_romanian_infantry:0 "Guards Infantry"
 AXI_romanian_infantry_desc:0 "Romania fielded two Guard Divisions in the War. The Guards Division was a well-equipped and well trained force involved in the Siege of Odessa. The second was made from border guards.\n\nThese §YKey Pieces§! excel in battle against infantry. Use them to hold the line."
 AXI_romanian_infantry_tt:0 "Adds §Y3 20-width Infantry Divisions§! with support artillery.\n"
 AXI_romanian_oil:0 "Ploiesti Oil Fields"
 AXI_romanian_oil_desc:0 "The Romanian Oil Fields played a vital role in the Axis war effort. The largest of these fields near the town of Ploiesti were an important target of allied bombing raids.\n\nGain §YOil§! to fuel your armoured units, navy, and airforce."
 AXI_siege_warfare:0 "Siege Warfare"
 AXI_siege_warfare_desc:0 "The Romanian 4th Army led the attack during the Siege of Odessa. The army gained much experience form the fierce fighting against dense urban fortifications.\n\nGain a bonus to §YReinforce rate§! and attack against §YForts§!."
 AXI_tacam:0 "TACAM"
 AXI_tacam_desc:0 "The Tun Anticar pe Afet Mobil (TACAM) series of tank destroyers were locally designed and produced in Romania during the War. They were built by Leonida in Bucharest.\n\nGain a bonus to §YTank Destroyer Production§!. This §Ykey Piece§! can support attacks against enemy armor divisions."
 AXI_tacam_tt:0 "Adds a §Y30-width Tank Destroyer Division§!.\n"
 AXI_from_the_carpathians:0 "From the Carpathians"
 AXI_from_the_carpathians_desc:0 "The vast Carpathian Mountains that run through Romania are the perfect training ground for Romanian's Mountain Infantry.\n\nGain more §YSpecial Forces Capacity§! and build §YLand Forts§! faster."
 AXI_r_7:0 "The Conducător"
 AXI_r_7_desc:0 "The Conducător (meaning leader) was the title given to Marshal Ion Antonescu when he seized power from King Carol II. He ruled with an iron fist until being overthrown in a pro-Allied coup by King Michael I.\n\nGain §YIon Antonescu§! as your leader, giving §YOrganisation§!, and §YAttack§! bonuses."
 ### End Goal ###
 AXI_for_the_homeland:0 "For the Homeland"
 AXI_for_the_homeland_desc:0 "For many Hungarians and Romanians the War was to protect their homeland from foreign threats, chiefly among those being the Soviet Union and each other. They failed.\n\nThe §YUltimate§! of this tree, giving §Yequipment§! at the start of every month."
 AXI_for_the_homeland_tt:0 "§YEvery Month§! we will receive an §YArms Delivery§! from Germany containing: \n·  §Y1500§! $infantry_equipment$\n·  §Y200§! $artillery_equipment$\n·  §Y200§! $anti_tank_equipment$\n·  §Y200§! $anti_air_equipment$\n·  §Y200§! $support_equipment$\n \nWe will receive Equipment suitable to our level of Technology. \n"
 #--spelling error--#
 ### Shared, Hungary Romania & Wehrmacht ###
 AXI_adopt_panzer_iv_h:0 "Adopt the Panzer IV Ausf. H"
 AXI_adopt_panzer_iv_h_desc:0 "The best tank of the early war, the Panzer IV was instrumental in the Battle of France and later in Barbarossa with predictable results.\n\nGain 250 §YMedium tanks§!."
 AXI_adopt_panzer_iv_h_tt:0 "§Y400 Panzer IV Ausf. H§! improved medium tanks are added to the national stockpile.\n"
 AXI_surface_raiders:0 "Surface Raiders"
 AXI_surface_raiders_desc:0 "Surface Raiders"
 AXI_surface_raiders_tt:0 "Adds a §YFleet§! with §Y2 Battleships§!."
 ### AXI Wehrmacht ###
 AXI_wehrmacht:0 "OKW"
 AXI_wehrmacht_desc:0 "Villains of war movies since 1950, the Wehrmacht were the main opponent of the Allies in Europe, their legacy surviving in movies to this day.\n\nGain §YShips§!, §YGenerals§!, §YCharacters§! and §YDesigns§!."
 AXI_add_german_equipment_tt:0 "Adds German Tank, Ship, and Aircraft designs."
 AXI_add_german_units_tt:0 "Adds the §YGerman Fleet§!."
 ### Panzer Group West ###
 AXI_afrika_korps:0 "Panzer Group West"
 AXI_afrika_korps_desc:0 "A combination of Hard Hitting Panzers and Fast Moving motorized, The Panzer Group West rely on brute force and speed to overwhelm the enemy, before supplies run too thin.\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_blocking_force:0 "Establish a Blocking Force"
 AXI_blocking_force_desc:0 "In the flat deserts of North Africa, maneuver warfare and speed became paramount. Attempts were made to cut off possible avenues of attack through minefields and tank traps with varying success, thanks to British counterplay.\n\nGain bonuses to §YEngineer§! research and §YEntrenchment§!."
 AXI_5th_light_division:0 "5th Light Division"
 AXI_5th_light_division_desc:0 "One of the two armoured divisions making up the Afrika-Korps, the 5th Light Division fought at El Alamein and later in Normandy before being destroyed in the Battle of Berlin.\n\nThis §YKey Piece§! is adept at exploiting gaps in the enemy frontline."
 AXI_5th_light_division_tt:0 "Adds §Y2 15-width Motorized Divisions§!."
 AXI_nibelungenwerk:0 "Nibelungenwerk"
 AXI_nibelungenwerk_desc:0 "The Nibelungenwerk was one of the largest and most modern tank factories in Europe during the war. Producing more than half of Germany's Panzer IV tanks during the war, it was captured in 1945.\n\nGain bonuses to §YEquipment conversation§! in addition to §YMedium§! and §YHeavy tank§! production."
 AXI_ostbau_werke_tt:0 "Adds a §Y 30-width Armored Division§! with Motorized Rocket Artillery, SPAA and support companies."
 AXI_wehrmacht_einheitskanister:0 "The Wehrmacht Einheitskanister"
 AXI_wehrmacht_einheitskanister_desc:0 "The most enduring and successful invention of the Wehrmacht, the Einheitskanister would show itself to be excellently suited for the realities of war in comparison to the British Flimsy.\n\nGain bonuses to §YSupply§! and §YFuel consumption§!."
 AXI_15th_panser_division:0 "10th Panzer Division"
 AXI_15th_panser_division_desc:0 "Having fought on all major fronts of the European Theater, the 10th Panzer Division would fight against all three major Allied Powers before being destroyed in North Africa. Several of its members would be part of Operation Valkyrie later in the war.\n\nThis §YKey Piece§! can break down entrenched lines with ease."
 AXI_15th_panser_division_tt:0 "Adds a §O32-Width Heavy Tank Division§!."
 AXI_last_of_the_luftwaffe:0 "Last of the Lufwaffe"
 AXI_last_of_the_luftwaffe_desc:0 "Though battered and bruised, the Luftwaffe continued the fight against the Allies until the end, despite the war crimes and similar actions taken to ensure this.\n\nGain 100 §YFocke-Wulf 190§! and §Y100 Air Experience§!."
 AXI_the_desert_fox:0 "The Desert Fox"
 AXI_the_desert_fox_desc:0 "Erwin Rommel led the Afrika-Korps against the British Army in North Africa, advancing through the continent before being routed at the Battle of El-Alamein and driven all the way back to Tunis.\n\nGain §YErwin Rommel§! as your leader, giving §YHeat attrition§!, and §YSupply§! bonuses."
 ### Fourth Army ###
 AXI_wehrmacht_4th_army:0 "4th Army"
 AXI_wehrmacht_4th_army_desc:0 "A combination of Elite Infantry and Defensive Emplacements, 4th Army Wehrmacht are a tough nut to crack if you let them dig in\n\nGain §YGenerals§!, §YDoctrine§! cost reductions and §YExperience§!."
 AXI_12th_volksgrenadier_division:0 "15th Panzergrenadier Division"
 AXI_12th_volksgrenadier_division_desc:0 "Formed in Sicily from the remnants of the old 15th Panzer Division and the garrison on Sicily, the 15th Panzergrenadiers fought in Italy, before being transferred to France in the closing days of the war.\n\nThis §YKey Piece§! is particularly effective at holding the line and plugging gaps quickly."
 AXI_supplies_from_the_sky:0 "Supplies from the Sky"
 AXI_supplies_from_the_sky_desc:0 "During the Battle of Stalingrad, the German forces were encircled by the Red Army, cutting off supplies from the outside. In an attempt to keep them fed, the Luftwaffe attempted to paradrop supplies. It failed.\n\nGain various kinds of §Yequipment§!."
 AXI_mp40:0 "MP 40"
 AXI_mp40_desc:0 "A submachinegun produced by Germany during the Second World War, the MP40 found itself one of the best submachineguns at the start of the war, with great influence on later SMGs.\n\nGain bonuses to §YInfantry Attack§!."
 AXI_7th_panzer_division:0 "7th Panzer Division"
 AXI_7th_panzer_division_desc:0 "Participating in the Battle of France, and in Barbarossa, the 7th Panzer Division earned its nickname as the 'Ghost Division' due to its speed such that even its superiors lost track of it.\n\nThis §YKey Piece§! can quickly exploit gaps, and encircle defenders caught unaware."
 AXI_jericho_horns:0 "Jericho Horns"
 AXI_jericho_horns_desc:0 "Mounted to Stukas and other divebombers by the Luftwaffe, the 'Jericho Horns' proved a fearsome weapon of psychological warfare on both the Eastern and Western Fronts, usually heralding an attack.\n\nGain §Y100§! Ju-87 (CAS) and bonuses to their §YProduction cost§!."
 AXI_jericko_tt:0 "Adds §Y100 CAS§! (Ju 87 variant)"
 AXI_singing_dora:0 "Singing Dora"
 AXI_singing_dora_desc:0 "Designed to break through the Maginot Line, the railway gun 'Dora' would be deployed against Stalingrad, with its sibling Gustav deployed against Sevastopol.\n\nGain a §YRailway gun§!"
 AXI_appoint_the_clever_hans:0 "The Stallion"
 AXI_appoint_the_clever_hans_desc:0 "Known as the 'Clever Hans' in Army circles, von Kluge led forces during all major operations of the Second World War, including being promoted to Field Marshal in 1940 for the invasion of France.\n\nGain §YGünther von Kluge§! as your leader, giving §YPlanning§!, §YFactory output§! and §YOrganization recovery§! bonuses."
 ### End Goal ###
 AXI_sonnenblume:0 "Gott Mit Uns"
 AXI_sonnenblume_desc:0 "Throughout the first phase of the war, the German Wehrmacht seemed to enjoy an almost cosmic level of luck, being able to overrun most of Western and Central Europe in less than a year, leading some to think that God was with them.\n\nThe §YUltimate§! of the German tree, giving bonuses to §YAttack§!, §YDefence§! and §YArmor§!"
 ### Shared, Wehrmacht & Royal Italian Army ###
 AXI_anti_tank_tactics:0 "Adopt Anti-Tank Tactics"
 AXI_anti_tank_tactics_desc:0 "North Africa proved to be by far the most motorized theater of the war due to long distances and harsh climates necessitating quick and mobile units. Anti-tank tactics, including mines and rifles therebfore became mandatory in turn.\n\nGain §YAnti-tank§! and §YAnti-air§!."
